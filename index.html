<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talent Tap - Share Your Skills</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🔥 Talent Tap</h1>
      <p class="subtitle">Share your talents and discover amazing skills</p>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Input Section -->
      <section class="input-section">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>
        
        <div class="form-group">
          <label for="skill">Your Skill</label>
          <input type="text" id="skill" placeholder="Enter your skill" required>
        </div>
        
        <button class="btn btn-primary" onclick="addUser()">Post Talent</button>
      </section>

      <!-- Stats Section -->
      <section class="stats-section">
        <div class="stat-card">
          <span class="stat-number" id="talentCount">0</span>
          <span class="stat-label">Talents Posted</span>
        </div>
      </section>

      <!-- List Section -->
      <section class="list-section">
        <h2>Recent Talents</h2>
        <ul id="list" class="talent-list"></ul>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2026 Talent Tap. All rights reserved.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
